# /etc/limine-entry-tool.d/macbook81-spi-fix.conf
#
# MacBook8,1 (MacBook Retina 12-inch, Early 2015) on Omarchy 4.
#
# The GSPI controller at 00:15.4 runs its transfers through the DesignWare DMA
# engine at 00:15.0 (dw_dmac_pci, built into the kernel). Those DMA transfers
# never complete, so every applespi SPI message times out with -110 and the
# built-in keyboard and touchpad are dead. Blacklisting the dw_dmac_pci
# initcall leaves no DMA channel available, so pxa2xx_spi falls back to PIO,
# which works.
#
# See https://github.com/basecamp/omarchy/issues/1954
KERNEL_CMDLINE[default]+=" initcall_blacklist=dw_pci_driver_init"

# Suspend: use s2idle.
#
# NOTE: do NOT add a detach-on-suspend system-sleep hook alongside this. The
# upstream gist's hook (modprobe -r applespi + unbind 00:15.4 before suspend)
# was tested and REMOVED: unbinding applespi destroys the wake source, so only
# an external USB keyboard could wake the machine. With no such hook, suspend
# and wake-from-built-in-keyboard both work.
#
# That ban is about unbinding, not about sleep hooks as a category.
# conf/macbook81-kbd-backlight in this repo is a sleep hook, and is required:
# it only writes a brightness value, and touches no driver binding.
KERNEL_CMDLINE[default]+=" mem_sleep_default=s2idle"
