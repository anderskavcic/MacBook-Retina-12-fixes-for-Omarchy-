# /etc/limine-entry-tool.d/macbook81-spi-fix.conf
#
# MacBook8,1 (MacBook Retina 12-inch, Early 2015) on Omarchy 4.
#
# The GSPI controller at 00:15.4 runs its transfers through the DesignWare>
# engine at 00:15.0 (dw_dmac_pci, built into the kernel). Those DMA transf>
# never complete, so every applespi SPI message times out with -110 and the
# built-in keyboard and touchpad are dead. Blacklisting the dw_dmac_pci
# initcall leaves no DMA channel available, so pxa2xx_spi falls back to PI>
# which works.
#
# See https://github.com/basecamp/omarchy/issues/1954
KERNEL_CMDLINE[default]+=" initcall_blacklist=dw_pci_driver_init"

# Suspend: use s2idle.
#
# NOTE: do NOT add a system-sleep hook alongside this. The upstream gist's
# detach-on-suspend hook (modprobe -r applespi + unbind 00:15.4 before sus>
# was tested and REMOVED: unbinding applespi destroys the wake source, so >
# an external USB keyboard could wake the machine. With no hook at all, su>
# and wake-from-built-in-keyboard both work.
KERNEL_CMDLINE[default]+=" mem_sleep_default=s2idle"
